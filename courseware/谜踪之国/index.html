<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#11120f">
<title>《谜踪之国》· 寻向迷津</title>
<link rel="stylesheet" href="./styles.css?v=20260911-1705">
<link rel="stylesheet" href="./images.css?v=20260911-1705">
</head>
<body>
<div id="app">
  <header id="topbar">
    <div class="brand"><b>寻向迷津</b><span>《谜踪之国》讲解课件</span></div>
    <div class="toolbar">
      <button id="overviewBtn" title="总览（O）">总览</button>
      <button id="notesBtn" title="讲稿（N）">讲稿</button>
      <button id="fullscreenBtn" title="全屏（F）">全屏</button>
    </div>
  </header>

  <main id="stage">
    <div id="deck" aria-live="polite"></div>
    <button id="prev" class="nav nav-left" aria-label="上一页">‹</button>
    <button id="next" class="nav nav-right" aria-label="下一页">›</button>
    <div id="pageIndicator"></div>
    <div id="progress"><i></i></div>
  </main>

  <aside id="notesPanel"><div class="notes-head"><b>讲稿 / 备注</b><button id="closeNotes">×</button></div><div id="notesContent"></div></aside>
  <section id="overview" aria-hidden="true"><div class="overview-shell"><div class="overview-head"><b>页面总览</b><span>点击任意页跳转 · O / Esc 关闭</span></div><div id="thumbs"></div></div></section>
</div>
<script>
(function(){
  const showStartupError=(msg)=>{
    const deck=document.getElementById('deck');
    if(!deck)return;
    deck.innerHTML='<section class="slide"><div class="slide-inner" style="display:grid;place-items:center;text-align:center"><div><h1 class="title">课件启动失败</h1><p style="font-size:20px;line-height:1.7">'+String(msg).replace(/[&<>]/g,s=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[s]))+'</p><p style="opacity:.7">请强制刷新页面；如果仍然出现，请把此错误信息发给我。</p></div></div></section>';
  };
  window.addEventListener('error',e=>showStartupError(e.message||'未知脚本错误'));
  window.addEventListener('unhandledrejection',e=>showStartupError((e.reason&&e.reason.message)||e.reason||'Promise 启动错误'));

  if(window.Response && Response.prototype && Response.prototype.text){
    const nativeText=Response.prototype.text;
    Response.prototype.text=async function(){
      if(this.body && typeof this.body.getReader==='function'){
        try{
          const reader=this.body.getReader();
          const chunks=[];let total=0;
          for(;;){const r=await reader.read();if(r.done)break;chunks.push(r.value);total+=r.value.length;}
          const out=new Uint8Array(total);let off=0;
          for(const c of chunks){out.set(c,off);off+=c.length;}
          return new TextDecoder().decode(out);
        }catch(err){
          try{return await nativeText.call(this);}catch(_){throw err;}
        }
      }
      return nativeText.call(this);
    };
  }

  globalThis.eval=function(code){
    const s=document.createElement('script');
    s.text=String(code);
    document.head.appendChild(s);
    s.remove();
  };
})();
</script>
<script src="./slides.js?v=20260911-1705"></script>
<script src="./art.js?v=20260911-1705"></script>
<script src="./art-images.js?v=20260911-1705"></script>
<script src="./app.js?v=20260911-1705"></script>
</body>
</html>
