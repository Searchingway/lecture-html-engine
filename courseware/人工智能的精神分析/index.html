<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%2311131a'%2F%3E%3Cpath d='M8 32h48M32 8v48' stroke='%23FF5A1F' stroke-width='8'%2F%3E%3Ccircle cx='32' cy='32' r='12' fill='%236E4AFF'%2F%3E%3C%2Fsvg%3E">
<title>人工智能的精神分析｜系列课程完整版</title>
<link rel="stylesheet" href="../../engine/lecture-engine.css">

</head>
<body>
<div id="app">
  <div class="topline"></div><div class="grain"></div>
  <main id="homeView" aria-label="课程首页"></main>
  <main id="lectureView" class="hidden" aria-live="polite">
    <div class="stage-wrap"><section id="stage" class="stage" aria-label="课程页面"></section></div>
    <canvas id="annotationCanvas" width="1600" height="900" aria-label="批注画布"></canvas>
    <div id="inkToolbar" class="ink-toolbar hidden"></div>
    <aside id="notesDrawer" class="notes-drawer hidden"></aside>
    <nav class="lecture-chrome" aria-label="演示控制">
      <div class="hud"><span id="hudCourse"></span><div class="progress-track"><div id="progressFill" class="progress-fill"></div></div><strong id="hudPage"></strong></div>
      <div class="nav-cluster"><button class="chrome-btn" data-action="prevCourse" title="上一课 P">◀◀</button><button class="chrome-btn" data-action="prev" title="上一页 ←">◀</button><button class="chrome-btn" data-action="next" title="逐条/下一页 Space">▶</button><button class="chrome-btn" data-action="nextCourse" title="下一课 N">▶▶</button></div>
      <div class="right-tools"><button class="chrome-btn" data-action="search" title="搜索 /">⌕</button><button class="chrome-btn" data-action="menu" title="课程 C">C</button><button class="chrome-btn" data-action="map" title="地图 M">M</button><button class="chrome-btn" data-action="notes" title="讲稿 D">D</button><button class="chrome-btn" data-action="draw" title="批注 E">✎</button><button class="chrome-btn" data-action="home" title="首页 H">⌂</button><button class="chrome-btn" data-action="fullscreen" title="全屏 F">⛶</button></div>
    </nav>
  </main>
  <div id="modalRoot"></div><div id="toast" class="toast hidden"></div>
</div>
<script src="data/meta.js"></script>
<script src="data/courses-01-03.js"></script>
<script src="data/courses-04-06.js"></script>
<script src="data/courses-07-09.js"></script>
<script src="data/courses-10-12.js"></script>
<script src="data/courses-13-15.js"></script>
<script src="data/courses-16-18.js"></script>
<script src="data/courses-19-21.js"></script>
<script src="data/courses-22-22.js"></script>
<script src="../../engine/lecture-engine.js"></script>

</body>
</html>
