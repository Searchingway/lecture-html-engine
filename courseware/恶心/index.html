<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>《恶心》91页讲课PPT</title><style>html,body{height:100%;margin:0;background:#12100e;color:#f7f0e6;font-family:"Microsoft YaHei",system-ui,sans-serif}body{display:grid;place-items:center}.loading{opacity:.82;text-align:center}.loading b{display:block;font-size:22px;margin-bottom:10px}.loading span{font-size:13px;color:#cfc5b8}</style></head><body><div class="loading"><b>《恶心》课件加载中…</b><span>91 pages · illustrated V2</span></div><script>
(async()=>{try{
const pageNames=['page_1.bin','page_2.bin','page_3.bin','page_4.bin','page_5.bin'];
const assetNames=['asset_1.bin','asset_2.bin','asset_3.bin','asset_4.bin','asset_5.bin','asset_6.bin'];
const get=async names=>{const rs=await Promise.all(names.map(u=>fetch('./'+u,{cache:'no-cache'})));rs.forEach(r=>{if(!r.ok)throw new Error('HTTP '+r.status)});const bs=await Promise.all(rs.map(r=>r.arrayBuffer()));const n=bs.reduce((s,b)=>s+b.byteLength,0),out=new Uint8Array(n);let o=0;for(const b of bs){out.set(new Uint8Array(b),o);o+=b.byteLength}return out};
if(typeof DecompressionStream==='undefined')throw new Error('浏览器不支持 DecompressionStream');
const [pg,pk]=await Promise.all([get(pageNames),get(assetNames)]);
const text=await new Response(new Blob([pg]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
const dv=new DataView(pk.buffer,pk.byteOffset,pk.byteLength),ml=dv.getUint32(0,true),dec=new TextDecoder(),manifest=JSON.parse(dec.decode(pk.slice(4,4+ml))),base=4+ml;
let html=text;for(const e of manifest){const blob=new Blob([pk.slice(base+e.offset,base+e.offset+e.length)],{type:'image/webp'}),url=URL.createObjectURL(blob);html=html.split('assets/'+e.name).join(url)}
document.open();document.write(html);document.close();
}catch(e){document.body.innerHTML='<div class="loading"><b>课件加载失败</b><span>'+String(e.message||e)+'</span></div>'}})();
</script></body></html>
